[project]
name = "twitter"
version = "0.1.0"
description = "X (Twitter) publishing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "setuptools<81",
    "twitter-text-parser>=3.0.0",
    "xdk>=0.10.6,<0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]
[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning:twitter_text.*"]
