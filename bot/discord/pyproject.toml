[project]
name = "discord-bot"
version = "0.1.0"
description = "Discord publishing service: posts to configured channels over HTTP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0",
    "uvicorn>=0.32,<1",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
